site_name: AuthLoom
site_description: Authentication building blocks for FastAPI applications.
site_url: https://sreekarnv.github.io/authloom/
repo_url: https://github.com/sreekarnv/authloom
repo_name: sreekarnv/authloom
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

nav:
  - Home: index.md
  - Consumer Integration: consumer-integration.md
  - Database and Migrations: database-and-migrations.md
  - Configuration: configuration.md
  - Account Security Flows: account-security-flows.md
  - Security Model: security-model.md

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
