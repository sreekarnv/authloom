[project]
name = "authloom"
version = "0.1.0.dev0"
description = "Authentication building blocks for Python applications"
readme = "README.md"
authors = [
    { name = "Sreekar Nutulapati", email = "sreekarnv1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "S",
]
