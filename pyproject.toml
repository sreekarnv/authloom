[project]
name = "authloom"
version = "0.1.0a1"
description = "Authentication building blocks for FastAPI applications"
readme = "README.md"
authors = [
    { name = "Sreekar Nutulapati", email = "sreekarnv1@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["fastapi", "authentication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "cuid2>=2.0.1",
    "email-normalize>=3.1.0",
    "fastapi>=0.140.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "sqlalchemy>=2.0.51",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/sreekarnv/authloom"
Repository = "https://github.com/sreekarnv/authloom"
Issues = "https://github.com/sreekarnv/authloom/issues"
Changelog = "https://github.com/sreekarnv/authloom/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material==9.6.20",
]
sqlalchemy = [
    "sqlalchemy>=2.0.51",
]
test = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
extend-exclude = ["examples/*/alembic"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
