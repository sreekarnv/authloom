services:
  postgres:
    image: postgres:17
    container_name: authloom_credentials_auth_postgres
    environment:
      POSTGRES_USER: authloom
      POSTGRES_PASSWORD: authloom
      POSTGRES_DB: authloom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authloom -d authloom"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: authloom_credentials_auth_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
